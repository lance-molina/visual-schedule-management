<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Child view | Visual Schedule</title>
  <!-- Libraries are pinned and use Subresource Integrity. If the browser console reports an
       integrity mismatch, regenerate the hash for that exact file. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous">
  <!-- Nunito (weights 500 to 800) from Google Fonts. It needs internet; without it the page falls back to the system font and stays readable. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="child-view">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="app-header"></header>
  <main id="main" class="container py-4" tabindex="-1">
    <h1 class="visually-hidden">Today's tasks</h1>
    <!-- Child view rules: one primary action in the same place, a large picture with a short word,
         calm feedback, respects reduced motion, optional countdown that only starts on request. Tasks are completed HERE
         (there is no separate task-management page). -->
    <div class="child-view">
      <div class="d-flex justify-content-between align-items-start">
        <div class="cv-header" id="cv-header" hidden>
          <span id="cv-avatar-host"></span>
          <div><p class="cv-name" id="cv-name"></p><p class="cv-date" id="cv-date"></p></div>
        </div>
        <button id="exit-child-view" class="btn btn-outline-secondary btn-sm ms-auto" type="button"><i class="fa-solid fa-right-from-bracket me-1" aria-hidden="true"></i><span id="exit-label">Back to adult screens</span></button>
      </div>

      <div id="cv-live" class="visually-hidden" aria-live="polite" role="status"></div>
      <div id="cv-main" aria-live="polite"></div>

      <section id="strip-section" class="mt-4" hidden>
        <ol id="task-strip" class="task-strip"></ol>
      </section>
    </div>

    <div id="undo-bar" class="undo-bar" hidden>
      <span id="undo-text" class="fs-5"></span>
      <button id="undo-btn" class="btn btn-outline-primary" type="button"></button>
    </div>
  </main>

  <div id="toast-area" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="js/child-view.js"></script>
</body>
</html>
