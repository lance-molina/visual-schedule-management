<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Progress | Visual Schedule</title>
  <!-- Libraries are pinned and use Subresource Integrity. If the browser console reports an
       integrity mismatch, regenerate the hash for that exact file. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous">
  <!-- Nunito (weights 500 to 800) from Google Fonts. It needs internet; without it the page falls back to the system font and stays readable. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="progress">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="app-header"></header>
  <main id="main" class="container py-4" tabindex="-1">
    <h1 class="h2 mb-4">Progress</h1>

    <div class="row g-3 mb-4 align-items-end">
      <div class="col-md-4"><label class="form-label" for="pg-child">Child</label><select class="form-select" id="pg-child"></select></div>
      <div class="col-md-5">
        <span class="form-label d-block" id="range-label">Range</span>
        <div class="btn-group range-group" role="group" aria-labelledby="range-label" id="range-buttons">
          <button type="button" class="btn btn-outline-primary" data-range="today" aria-pressed="false">Today</button>
          <button type="button" class="btn btn-outline-primary" data-range="week" aria-pressed="true">Week</button>
          <button type="button" class="btn btn-outline-primary" data-range="month" aria-pressed="false">Month</button>
        </div>
      </div>
      <div class="col-md-3"><button class="btn btn-outline-primary w-100" id="export-report" type="button"><i class="fa-solid fa-download me-2" aria-hidden="true"></i>Export report</button></div>
    </div>

    <div id="pg-error" class="error-banner mb-3" role="alert" hidden>
      <span id="pg-error-text"></span>
      <button class="btn btn-outline-primary btn-sm ms-2" id="pg-retry" type="button">Retry</button>
    </div>

    <div class="row g-3 mb-4" id="progress-cards">
      <div class="col-md-4"><div class="card metric p-3 h-100"><div class="text-muted"><i class="fa-solid fa-bullseye me-2" aria-hidden="true"></i>Completion rate</div><div class="metric-number" id="m-rate">–</div></div></div>
      <div class="col-md-4"><div class="card metric p-3 h-100"><div class="text-muted"><i class="fa-solid fa-circle-check me-2" aria-hidden="true"></i>Tasks completed</div><div class="metric-number" id="m-completed">–</div></div></div>
      <div class="col-md-4"><div class="card metric p-3 h-100"><div class="text-muted"><i class="fa-solid fa-list-check me-2" aria-hidden="true"></i>Tasks scheduled</div><div class="metric-number" id="m-scheduled">–</div></div></div>
    </div>

    <p id="pg-empty" class="text-muted" hidden>No tasks were scheduled in this range, so there is nothing to chart yet.</p>

    <div id="charts">
      <section aria-labelledby="daily-h" class="mb-4">
        <h2 id="daily-h" class="h4">Daily completion</h2>
        <div class="chart-wrap"><canvas id="daily-chart" role="img" aria-label="Daily completion bar chart"></canvas></div>
      </section>
      <section aria-labelledby="weekly-h" class="mb-4">
        <h2 id="weekly-h" class="h4">Weekly trend</h2>
        <div class="chart-wrap"><canvas id="weekly-chart" role="img" aria-label="Weekly trend line chart"></canvas></div>
      </section>
      <section aria-labelledby="tasks-h" class="mb-4">
        <h2 id="tasks-h" class="h4">Most and least completed tasks</h2>
        <div class="chart-wrap"><canvas id="tasks-chart" role="img" aria-label="Most and least completed tasks, horizontal bar chart"></canvas></div>
      </section>
    </div>

    <p id="chart-summary" class="text-muted" role="status"></p>
    <button class="btn btn-outline-primary btn-sm" id="toggle-table" type="button" aria-expanded="false" aria-controls="chart-table">View as table</button>
    <div id="chart-table" class="mt-3" hidden></div>
  </main>

  <div id="toast-area" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.6.1/dist/chart.umd.min.js" integrity="sha384-Emf5ZVIUiarAdhkgtqK+5/Z5qIvM6QoVrS+qAVtfyZVuD5lIHrac0me485+Antp0" crossorigin="anonymous"></script>
  <script type="module" src="js/progress.js"></script>
</body>
</html>
