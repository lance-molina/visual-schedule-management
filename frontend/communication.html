<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Talking board | Visual Schedule</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="communication">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="app-header"></header>
  <main id="main" class="container py-4" tabindex="-1">
    <h1 class="h2 mb-1" id="talk-title">Talking board</h1>
    <p class="text-muted" id="talk-help">Tap a picture to say the word. Tap several pictures to build a sentence.</p>

    <!-- Sentence strip: the words chosen so far and the buttons that act on them. -->
    <section class="sentence-strip" aria-labelledby="sentence-h">
      <h2 id="sentence-h" class="visually-hidden">Sentence</h2>
      <ol id="sentence" class="sentence-words" aria-live="polite"></ol>
      <div class="sentence-actions">
        <button id="speak-btn" type="button" class="btn btn-success btn-lg"><i class="fa-solid fa-volume-high me-2" aria-hidden="true"></i><span id="speak-label">Speak</span></button>
        <button id="back-btn" type="button" class="btn btn-outline-secondary btn-lg"><i class="fa-solid fa-delete-left me-2" aria-hidden="true"></i><span id="back-label">Remove last</span></button>
        <button id="clear-btn" type="button" class="btn btn-outline-danger btn-lg"><i class="fa-solid fa-xmark me-2" aria-hidden="true"></i><span id="clear-label">Clear</span></button>
      </div>
      <p id="voice-note" class="small text-muted mb-0 mt-2" hidden></p>
    </section>

    <div id="cat-tabs" class="cat-tabs" role="group" aria-label="Categories"></div>
    <div id="card-grid" class="card-grid"></div>

    <!-- Adult tools: add or delete the cards that belong to this account. -->
    <section class="card p-3 mt-4" aria-labelledby="tools-h">
      <h2 id="tools-h" class="h5 mb-0">
        <button class="btn btn-link p-0 text-decoration-none fw-semibold" type="button" data-bs-toggle="collapse" data-bs-target="#tools-body" aria-expanded="false" aria-controls="tools-body">
          <i class="fa-solid fa-screwdriver-wrench me-2" aria-hidden="true"></i>Caregiver tools
        </button>
      </h2>
      <div class="collapse" id="tools-body">
        <form id="card-form" class="mt-3" novalidate style="max-width: 38rem;">
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label" for="card-label">Word to speak</label>
              <input class="form-control" id="card-label" maxlength="30" autocomplete="off" placeholder="e.g. Banana">
            </div>
            <div class="col-sm-6">
              <label class="form-label" for="card-category">Category</label>
              <select class="form-select" id="card-category"></select>
            </div>
            <div class="col-12" id="new-category-wrap" hidden>
              <label class="form-label" for="card-new-category">New category name</label>
              <input class="form-control" id="card-new-category" maxlength="30" autocomplete="off" placeholder="e.g. Toys">
            </div>
            <div class="col-12">
              <fieldset><legend class="form-label fs-6">Picture</legend>
                <div id="picture-picker" class="picture-picker"></div>
              </fieldset>
            </div>
          </div>
          <div id="card-form-error" class="form-error mt-2" role="alert"></div>
          <button class="btn btn-primary mt-2" id="card-save" type="submit"><i class="fa-solid fa-plus me-2" aria-hidden="true"></i>Add card</button>
        </form>

        <h3 class="h6 mt-4">Your cards</h3>
        <p class="text-muted small mb-2" id="my-cards-empty">You have not added any cards yet. The starter cards cannot be deleted.</p>
        <ul id="my-cards" class="list-unstyled mb-0"></ul>
      </div>
    </section>
  </main>

  <div id="toast-area" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="js/communication.js"></script>
</body>
</html>
