<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard | Visual Schedule</title>
  <!-- Libraries are pinned and use Subresource Integrity. If the browser console reports an
       integrity mismatch, regenerate the hash for that exact file. -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.7.2/css/all.min.css" integrity="sha384-nRgPTkuX86pH8yjPJUAFuASXQSSl2/bBUiNV47vSYpKFxHJhbcrGnmlYpYJMeD7a" crossorigin="anonymous">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="dashboard">
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="app-header"></header>
  <main id="main" class="container py-4" tabindex="-1">
    <h1 class="h2 mb-4">Dashboard</h1>

    <div id="dash-error" class="error-banner mb-4" role="alert" hidden>
      <span id="dash-error-text"></span>
      <button class="btn btn-outline-primary btn-sm ms-2" id="dash-retry" type="button">Retry</button>
    </div>

    <section aria-labelledby="stats-h" class="mb-4">
      <h2 id="stats-h" class="visually-hidden">Today at a glance</h2>
      <div class="row g-3" id="stat-cards">
        <div class="col-md-4"><div class="card stat-card p-3 h-100"><div class="text-muted">Total Children</div><div class="stat-number" id="stat-children">–</div></div></div>
        <div class="col-md-4"><div class="card stat-card p-3 h-100"><div class="text-muted">Tasks Completed Today</div><div class="stat-number" id="stat-completed">–</div></div></div>
        <div class="col-md-4"><div class="card stat-card p-3 h-100"><div class="text-muted">Upcoming Routines</div><div class="stat-number" id="stat-upcoming">–</div><div class="small text-muted">Schedules from today with a task still to do</div></div></div>
      </div>
    </section>

    <section aria-labelledby="children-h">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 id="children-h" class="h4 mb-0">Children</h2>
        <button class="btn btn-primary" id="add-child-btn" type="button"><i class="fa-solid fa-plus me-2" aria-hidden="true"></i>Add child</button>
      </div>
      <div id="children-list" class="row g-3"></div>
    </section>

    <div class="modal fade" id="child-modal" tabindex="-1" aria-labelledby="child-modal-title" aria-hidden="true">
      <div class="modal-dialog"><form class="modal-content" id="child-form" novalidate>
        <div class="modal-header"><h2 class="modal-title h5" id="child-modal-title">Add child</h2><button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button></div>
        <div class="modal-body">
          <p class="small text-muted">Use a first name only. Do not enter surnames or other identifying details.</p>
          <div class="mb-3"><label class="form-label" for="child-name">First name</label><input class="form-control" id="child-name" data-field="name" maxlength="100" required></div>
          <div class="mb-3"><label class="form-label" for="child-age">Age (1 to 18)</label><input class="form-control" id="child-age" data-field="age" type="number" min="1" max="18" inputmode="numeric" required></div>
          <div class="mb-3"><label class="form-label" for="child-domain">Delay category</label><select class="form-select" id="child-domain" data-field="delay_domain" required></select></div>
          <div class="mb-3"><label class="form-label" for="child-notes">Notes (optional)</label><textarea class="form-control" id="child-notes" data-field="notes" maxlength="500" rows="3"></textarea></div>
          <fieldset class="mb-3"><legend class="form-label fs-6">Avatar</legend><div class="avatar-picker" id="avatar-picker"></div></fieldset>
          <div id="child-form-error" class="form-error" role="alert"></div>
        </div>
        <div class="modal-footer"><button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button><button type="submit" class="btn btn-primary" id="child-save">Save</button></div>
      </form></div>
    </div>
  </main>

  <div id="toast-area" class="toast-container position-fixed bottom-0 end-0 p-3" aria-live="polite"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
